name: Update Epistemic Commons API

on:
  schedule:
    - cron: '0 6 * * *'      # Daily at 6AM UTC
  workflow_dispatch:          # Manual trigger from GitHub Actions tab

jobs:
  update-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Epistemic Commons Update
        run: python3 epistemic_commons_api.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "AUBIEETERNAL Swarm"
          git config user.email "actions@github.com"
          git add epistemic_commons/api/*.json
          git commit -m "🌐 Epistemic Commons API update — $(date +'%Y-%m-%d')"
          git push
