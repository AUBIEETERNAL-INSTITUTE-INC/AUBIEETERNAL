# Ollama concurrency override for a shared community/library deployment.
#
# Ollama defaults to OLLAMA_NUM_PARALLEL=1 - only ONE request per model
# served at a time. That's fine for a single family (one person asking a
# question at a time), but on a machine meant to serve a room full of
# walk-up patrons, a second and third person asking Aubie something at the
# same moment just queue (FIFO) behind the first - not broken, but everyone
# waits in a single-file line even if the machine has real headroom to
# help more than one person at once.
#
# NOT applied automatically to any running instance - this is a ready-to-
# install override, kept separate on purpose so a machine already serving
# one family isn't silently reconfigured. Install only on a machine that's
# actually meant to serve multiple simultaneous users (e.g. a donated
# library/community-center rig).
#
# Raising this costs real RAM/VRAM (each parallel slot adds its own
# context window - required memory scales with
# OLLAMA_NUM_PARALLEL * OLLAMA_CONTEXT_LENGTH), which is exactly where a
# stronger donated machine pays off more for a shared deployment than it
# would for a single family.
#
# Install (as root, on the machine meant to serve multiple people):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ollama-concurrency.conf /etc/systemd/system/ollama.service.d/concurrency.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama.service
#
# Tune OLLAMA_NUM_PARALLEL to that machine's real RAM - see
# recommend_model_to_pull()'s tiers in model_selector.py for the same
# kind of RAM-based judgment call already used elsewhere in this project.
# 4 is a reasonable starting point for a machine with 32GB+ RAM running a
# 7b-14b model; go lower on a smaller machine, higher on a genuinely
# strong one.

[Service]
Environment="OLLAMA_NUM_PARALLEL=4"
Environment="OLLAMA_MAX_QUEUE=32"
