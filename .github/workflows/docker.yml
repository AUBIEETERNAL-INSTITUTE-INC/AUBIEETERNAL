name: Build and Push Docker

on:
  push:
    branches: [ main ]
    paths:
      # Only rebuild when these files change — not on every swarm auto-push
      - 'Dockerfile'
      - 'requirements.txt'
      - 'start.sh'
      - 'app.py'
      - 'swarm/swarm_v4_1.py'
      - '.github/workflows/docker.yml'
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # CRITICAL: packages:write is required for ghcr.io push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hodlmateo/aubieeternal:v8
            ghcr.io/hodlmateo/aubieeternal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
