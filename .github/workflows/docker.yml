name: Build and Push Docker

# Disabled for automatic pushes: GitHub is backup only for this project.
# Live portal runs via systemd + venv on the rig, not a container registry.
# A push under a personal account name fails from this org repo (permission_denied).
# Keep this file for manual re-enable: Actions → Build and Push Docker → Run workflow.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/aubieeternal-institute-inc/aubieeternal:v8
          cache-from: type=gha
          cache-to: type=gha,mode=max
